messaging:
  rate-limit:
    messages-per-second: 10

micronaut:
  application:
    name: realtime-messaging
  server:
    netty:
      websocket:
        max-frame-payload-length: 4096  # 4KB - rejects oversized frames at network layer
  executors:
    message-processor:
      type: fixed
      n-threads: 10

endpoints:
  all:
    enabled: true
  health:
    enabled: true
    sensitive: false

logger:
  levels:
    root: INFO
    messaging: INFO
    messaging.ConnectionRegistry: DEBUG
    org.flywaydb: DEBUG
    io.micronaut.jdbc: DEBUG