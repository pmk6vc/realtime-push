name: PR checks (main)

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint / format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: gradle

      - name: Spotless + Checkstyle
        run: ./gradlew spotlessCheck checkstyleMain checkstyleTest --no-daemon --console=plain --stacktrace

      - name: Upload quality reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            **/build/reports/checkstyle/**
            **/build/reports/spotless/**
          if-no-files-found: ignore

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: gradle

      - name: Run unit tests
        run: ./gradlew test --no-daemon --console=plain --stacktrace

      - name: Upload unit test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/test/**
            **/build/test-results/test/**
          if-no-files-found: ignore

  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: gradle

      - name: Run E2E tests
        run: ./gradlew e2eTest --no-daemon --console=plain --stacktrace

      - name: Upload E2E test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-reports
          path: |
            **/build/reports/tests/e2eTest/**
            **/build/test-results/e2eTest/**
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
